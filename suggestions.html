<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suggestions — Hima George</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --sage:  #999B84;
  --cream: #F4EEED;
  --blush: #EFD9D1;
  --ink:   #3a2f2a;
  --muted: #7a6e69;
  --rule:  #d8c8c2;
  --white: #fff;
}
html { scroll-behavior: smooth; }
body { font-family: 'DM Sans', sans-serif; font-weight: 300; background: var(--cream); color: var(--ink); font-size: 16px; line-height: 1.75; min-height: 100vh; }

header {
  background: var(--sage); color: white;
  padding: 1.6rem 5vw;
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem;
  position: sticky; top: 0; z-index: 100;
}
header h1 { font-family: 'Lora', serif; font-weight: 600; font-size: clamp(1.1rem, 2.5vw, 1.45rem); }
header h1 a { color: inherit; text-decoration: none; }
nav { display: flex; gap: 0.2rem; }
nav a {
  color: rgba(255,255,255,0.75); text-decoration: none;
  font-size: 0.82rem; font-weight: 400; letter-spacing: 0.07em; text-transform: uppercase;
  padding: 0.35rem 0.85rem; border-radius: 3px; transition: color 0.2s, background 0.2s;
}
nav a:hover { color: white; background: rgba(255,255,255,0.15); }

.page { max-width: 820px; margin: 0 auto; padding: 3rem 5vw 5rem; }

.page-eyebrow { font-size: 0.73rem; letter-spacing: 0.13em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 0.5rem; }
.page h2 { font-family: 'Lora', serif; font-size: clamp(1.6rem, 3vw, 2.2rem); font-weight: 600; color: var(--ink); margin-bottom: 2rem; }

.controls {
  display: flex; flex-direction: column; gap: 0.75rem;
  margin-bottom: 1.75rem; padding-bottom: 1.25rem; border-bottom: 1px solid var(--rule);
}
.controls-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.75rem; }

.filter-chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.filter-chip {
  font-family: 'DM Sans', sans-serif; font-size: 0.78rem;
  padding: 0.28rem 0.75rem; border-radius: 20px;
  border: 1.5px solid var(--rule); background: white; color: var(--muted);
  cursor: pointer; transition: border-color 0.15s, background 0.15s, color 0.15s;
}
.filter-chip:hover { border-color: var(--sage); color: var(--ink); }
.filter-chip.active { border-color: var(--sage); background: var(--sage); color: white; }
.filter-chip.active.chip-bug { border-color: #9a2020; background: #fde8e8; color: #9a2020; }
.filter-chip.active.chip-suggestion { border-color: #266636; background: #ddf0e2; color: #266636; }

.sort-toggle { display: flex; border: 1.5px solid var(--rule); border-radius: 6px; overflow: hidden; }
.sort-btn {
  font-family: 'DM Sans', sans-serif; font-size: 0.78rem;
  padding: 0.3rem 0.8rem; border: none; background: white; color: var(--muted);
  cursor: pointer; transition: background 0.15s, color 0.15s; white-space: nowrap;
}
.sort-btn + .sort-btn { border-left: 1.5px solid var(--rule); }
.sort-btn.active { background: var(--sage); color: white; }

.results-count { font-size: 0.8rem; color: var(--muted); margin-bottom: 1rem; }

/* ── layouts ── */
.feed { display: flex; flex-direction: column; gap: 0.75rem; }

.feed.layout-single { display: flex; justify-content: center; }
.feed.layout-single .feed-item { width: 100%; max-width: 420px; }

.feed.layout-two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; align-items: start; }
.feed-col { display: flex; flex-direction: column; gap: 0.75rem; }
.feed-col-label {
  font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase;
  font-weight: 600; margin-bottom: 0.25rem;
}
.feed-col-label.label-bug { color: #9a2020; }
.feed-col-label.label-suggestion { color: #266636; }

@media (max-width: 560px) {
  .feed.layout-two-col { grid-template-columns: 1fr; }
}

.feed-item {
  background: white; border: 1px solid var(--rule); border-radius: 6px;
  padding: 1rem 1.2rem;
  animation: fadeUp 0.2s ease forwards;
}
@keyframes fadeUp { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }

.feed-item-top { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; flex-wrap: wrap; }
.feed-badge { font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase; padding: 0.18rem 0.5rem; border-radius: 2px; font-weight: 600; }
.badge-suggestion { background: #ddf0e2; color: #266636; }
.badge-issue      { background: #fde8e8; color: #9a2020; }
.badge-general    { background: #e8e8fd; color: #303086; }
.feed-tag { font-size: 0.72rem; color: var(--muted); background: #f3eaea; padding: 0.15rem 0.5rem; border-radius: 2px; }
.feed-desc { font-size: 0.93rem; color: var(--ink); line-height: 1.6; margin-bottom: 0.35rem; }
.feed-meta { font-size: 0.72rem; color: var(--muted); }

.loading { text-align: center; padding: 3rem 1rem; color: var(--muted); font-style: italic; }
.empty-state { text-align: center; padding: 4rem 1rem; color: var(--muted); font-style: italic; }
.empty-state a { color: var(--sage); text-decoration: none; }
.empty-state a:hover { text-decoration: underline; }
</style>
</head>
<body>

<header>
  <h1><a href="index.html">Hima George</a></h1>
  <nav>
    <a href="index.html#about">About</a>
    <a href="index.html#projects">Projects</a>
    <a href="index.html#whats-next">What's Next</a>
    <a href="resume.html">Resume</a>
  </nav>
</header>

<div class="page">
  <h2>All Suggestions</h2>

  <div class="controls">
    <div class="controls-row">
      <div class="filter-chips" id="filterChips">
        <button class="filter-chip active" data-tag="all">All</button>
        <button class="filter-chip" data-tag="General">General</button>
        <button class="filter-chip" data-tag="Space Traders">Space Traders Game</button>
        <button class="filter-chip" data-tag="Praire Journal">Prairie Journal</button>
        <button class="filter-chip" data-tag="SkinThreads">SkinThreads</button>
        <button class="filter-chip" data-tag="Portfolio 2.0">Portfolio 2.0</button>
      </div>
    </div>
    <div class="controls-row" style="margin-top: 0.0rem;">
      <div class="filter-chips" id="typeChips">
        <button class="filter-chip active" data-type="all">All types</button>
        <button class="filter-chip chip-bug" data-type="Bug">Bugs</button>
        <button class="filter-chip chip-suggestion" data-type="Suggestion">Suggestions</button>
      </div>
    </div>
    <div class="controls-row" style="margin-top: 0.6rem;">
      <div class="sort-toggle">
        <button class="sort-btn active" data-sort="newest">Newest</button>
        <button class="sort-btn" data-sort="oldest">Oldest</button>
      </div>
    </div>
  </div>

  <div class="feed" id="feed"><p class="loading">Loading suggestions&hellip;</p></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const { createClient } = window.supabase;
const client = createClient(
  'https://fngdqsaszyviqyszrdac.supabase.co',
  'sb_publishable_1YTgYnoqae1IL6tw0N5d-g_X3wNSyTY'
);

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function typeClass(type) {
  if (type === 'Bug') return 'badge-issue';
  if (type === 'General') return 'badge-general';
  return 'badge-suggestion';
}
function makeCard(s) {
  const item = document.createElement('div');
  item.className = 'feed-item';
  item.innerHTML = `
    <div class="feed-item-top">
      <span class="feed-badge ${escapeHtml(typeClass(s.type))}">${escapeHtml(s.type)}</span>
      <span class="feed-tag">${escapeHtml(s.tag)}</span>
    </div>
    <p class="feed-desc">${escapeHtml(s.description)}</p>
    <p class="feed-meta">${new Date(s.created_at).toLocaleDateString('en-CA', {year:'numeric',month:'short',day:'numeric'})}</p>`;
  return item;
}

let allSuggestions = [];
let activeTag = 'all';
let activeType = 'all';
let activeSort = 'newest';

async function loadAll() {
  const { data, error } = await client
    .from('suggestions')
    .select('*')
    .order('created_at', { ascending: false });
  if (error) {
    document.getElementById('feed').innerHTML = '<p class="empty-state">Could not load suggestions.</p>';
    return;
  }
  allSuggestions = data || [];
  render();
}

function render() {
  const feed = document.getElementById('feed');


  let list = [...allSuggestions];
  if (activeTag !== 'all') list = list.filter(s => s.tag === activeTag);
  if (activeType !== 'all') list = list.filter(s => s.type === activeType);
  if (activeSort === 'oldest') list = list.reverse();

  feed.innerHTML = '';

  if (list.length === 0) {
    feed.className = 'feed';
    feed.innerHTML = '<p class="empty-state">No suggestions yet. <a href="index.html#whats-next">Be the first.</a></p>';
    return;
  }

  const bugs = list.filter(s => s.type === 'Bug');
  const suggestions = list.filter(s => s.type === 'Suggestion');
  const hasBoth = bugs.length > 0 && suggestions.length > 0;

  if (list.length === 1) {
    // single item — centred
    feed.className = 'feed layout-single';
    feed.appendChild(makeCard(list[0]));
  } else if (hasBoth && activeType !== 'all') {
    // two-column split: bugs left, suggestions right (only when filtered by type)
    feed.className = 'feed layout-two-col';

    const bugCol = document.createElement('div');
    bugCol.className = 'feed-col';
    const bugLabel = document.createElement('p');
    bugLabel.className = 'feed-col-label label-bug';
    bugLabel.textContent = 'Bugs';
    bugCol.appendChild(bugLabel);
    bugs.forEach(s => bugCol.appendChild(makeCard(s)));

    const sugCol = document.createElement('div');
    sugCol.className = 'feed-col';
    const sugLabel = document.createElement('p');
    sugLabel.className = 'feed-col-label label-suggestion';
    sugLabel.textContent = 'Suggestions';
    sugCol.appendChild(sugLabel);
    suggestions.forEach(s => sugCol.appendChild(makeCard(s)));

    feed.appendChild(bugCol);
    feed.appendChild(sugCol);
  } else {
    // single column stack
    feed.className = 'feed';
    list.forEach(s => feed.appendChild(makeCard(s)));
  }
}

document.getElementById('filterChips').addEventListener('click', e => {
  const chip = e.target.closest('.filter-chip');
  if (!chip) return;
  document.querySelectorAll('#filterChips .filter-chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  activeTag = chip.dataset.tag;
  render();
});

document.getElementById('typeChips').addEventListener('click', e => {
  const chip = e.target.closest('.filter-chip');
  if (!chip) return;
  document.querySelectorAll('#typeChips .filter-chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  activeType = chip.dataset.type;
  render();
});

document.querySelector('.sort-toggle').addEventListener('click', e => {
  const btn = e.target.closest('.sort-btn');
  if (!btn) return;
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeSort = btn.dataset.sort;
  render();
});

loadAll();
</script>
</body>
</html>
