<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume — Hima George</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --sage:  #999B84;
    --cream: #F4EEED;
    --ink:   #3a2f2a;
    --muted: #7a6e69;
    --rule:  #d8c8c2;
  }
  body {
    font-family: 'DM Sans', sans-serif;
    font-size: 17px;
    font-weight: 300;
    line-height: 1.78;
    background: var(--cream);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--cream);
    color: var(--ink);
    padding: 1.5rem 5vw 1rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.9rem;
    border-bottom: 1px solid var(--rule);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header h1 {
    font-family: 'Lora', serif;
    font-weight: 600;
    font-size: clamp(1.6rem, 3.5vw, 2.4rem);
    line-height: 1.78;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  header h1 a { color: inherit; text-decoration: none; }
  nav { display: flex; gap: 0; justify-content: center; flex-wrap: wrap; }
  nav a {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.86rem;
    font-weight: 400;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    padding: 0.3rem 0.9rem;
    border-radius: 3px;
    transition: color 0.2s, background 0.2s;
  }
  nav a:hover { color: var(--ink); }
  nav a.active { color: var(--ink); }

  .resume-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 1rem 5vw 2rem;
    gap: 1.25rem;
  }
.pdf-frame {
    width: 100%;
    max-width: 900px;
    height: 85vh;
    border: 1px solid var(--rule);
    border-radius: 6px;
    background: white;
  }
  .no-pdf {
    width: 100%;
    max-width: 900px;
    padding: 3rem 2rem;
    background: white;
    border: 1px solid var(--rule);
    border-radius: 6px;
    text-align: center;
    color: var(--muted);
  }
  .no-pdf p { margin-bottom: 0.5rem; }
</style>
</head>
<body>

<header>
  <h1><a href="index.html">Hima George</a></h1>
  <nav>
    <a href="index.html#about">About</a>
    <a href="index.html#projects">Projects</a>
    <a href="index.html#whats-next">What's Next</a>
    <a href="resume.html" class="active">Resume</a>
  </nav>
</header>

<div class="resume-wrap">
  <object class="pdf-frame" data="resume-7.pdf" type="application/pdf">
    <div class="no-pdf">
      <p>PDF preview not available in this browser.</p>
      <p><a href="resume-7.pdf" download style="color: var(--sage);">Click here to download the resume.</a></p>
    </div>
  </object>
</div>

</body>
</html>
